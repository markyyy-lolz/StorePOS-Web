name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check web/app.js
          node --check web/retail.js
          node --check web/ops13.js
          node --check web/category-manager.js

      - name: Check StorePOS staff management security contract
        run: node --test tests/staff-management.test.mjs tests/auth-session.test.mjs

      - name: Verify portal route is present
        run: grep -q 'renderCustomerPortal' web/app.js
